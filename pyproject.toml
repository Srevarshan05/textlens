[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The import name is `textlens`. The short distribution name is unavailable on
# PyPI (it collides with the existing `text-lens` project), so the package is
# published as `textlens-ocr`.
name = "textlens-ocr"
dynamic = ["version"]
description = "OCR without the OCR complexity: model-agnostic OCR and document intelligence from Raspberry Pi to GPU servers."
readme = "README.md"
authors = [{ name = "TextLens Contributors" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
keywords = [
    "ocr", "document-ai", "pdf", "pdf-ocr", "selective-ocr", "pp-ocr", "onnx", "edge-ai",
    "vlm", "glm-ocr", "rag", "anpr", "fastapi", "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: General",
]
# The core stays small and CUDA-free: native PDF extraction (pypdfium2) and
# CPU OCR (PP-OCRv6 on ONNX Runtime) work out of the box. ONNX Runtime has no
# official 32-bit ARM wheels; on armv7 use a 64-bit OS (see docs).
dependencies = [
    "pillow>=9.0.0",
    "pypdfium2>=4.25.0",
    "numpy>=1.23",
    "onnxruntime>=1.16; platform_machine != 'armv7l' and platform_machine != 'armv6l'",
]

[project.optional-dependencies]
# Local document VLMs (GLM-OCR, LightOnOCR, HunyuanOCR, SmolVLM).
# Install a CUDA build of torch first on NVIDIA GPUs (`textlens doctor` prints the command).
gpu = ["torch>=2.1", "transformers>=4.45", "accelerate>=0.28", "huggingface_hub>=0.21"]
vlm = ["textlens-ocr[gpu]"]
# DOCX / PPTX native extraction.
documents = ["python-docx>=1.1", "python-pptx>=0.6.23"]
# REST API server.
server = ["fastapi>=0.110,<1.0", "uvicorn>=0.27", "python-multipart>=0.0.9", "pydantic>=2.0"]
# vLLM for self-hosting served models (Linux + NVIDIA). TextLens itself talks to
# any OpenAI-compatible endpoint without extra packages.
vllm = ["vllm>=0.6; sys_platform == 'linux'"]
# Number-plate recognition models (ONNX; bring opencv-python-headless).
anpr = ["fast-plate-ocr>=1.0", "open-image-models>=0.4"]
# Edge monitoring helpers (ONNX Runtime is already a core dependency).
edge = ["psutil>=5.9"]
# Model Context Protocol server for AI agents.
mcp = ["mcp>=1.2"]
# Rich terminal output and system telemetry (dashboard, doctor).
ui = ["rich>=13.0", "psutil>=5.9"]
# Live Hugging Face model discovery.
catalog = ["huggingface_hub>=0.21"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "rich>=13.0", "fastapi>=0.110,<1.0", "python-multipart>=0.0.9"]
# Curated: everything except vllm (Linux-only, very large).
all = ["textlens-ocr[gpu,documents,server,anpr,mcp,ui,catalog]"]
# 0.x extra names kept for compatibility.
inference = ["textlens-ocr[gpu]"]
gpu-utils = ["GPUtil>=1.4.0"]

[project.scripts]
textlens = "textlens.cli:main"

[project.urls]
Homepage = "https://github.com/Srevarshan05/textlens"
Documentation = "https://github.com/Srevarshan05/textlens/tree/main/docs"
Source = "https://github.com/Srevarshan05/textlens"
Issues = "https://github.com/Srevarshan05/textlens/issues"

[tool.setuptools.dynamic]
version = { attr = "textlens._version.__version__" }

[tool.setuptools.packages.find]
include = ["textlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs real model weights (PP-OCRv6); skipped if unavailable",
    "slow: slower integration tests",
]
filterwarnings = ["ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "B008", "S101", "S603", "S607", "UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
