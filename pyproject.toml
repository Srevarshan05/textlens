[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textlens"
version = "0.2.6"
description = "Local, VLM-powered OCR for Python: images, PDFs, batch processing, CUDA diagnostics, and a REST API."
readme = "README.md"
authors = [
    { name = "TextLens Team", email = "dev@textlens.org" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["ocr", "glm-ocr", "deep-learning", "pytorch", "document-ai", "pdf-ocr", "fastapi", "rest-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pillow>=9.0.0",
    "pypdfium2>=4.20.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
catalog = ["huggingface_hub>=0.21.0"]
inference = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "huggingface_hub>=0.21.0",
]
server = [
    "fastapi>=0.100.0,<1.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
]
ui = ["rich>=13.0.0", "psutil>=5.9.0"]
all = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "huggingface_hub>=0.21.0",
    "fastapi>=0.100.0,<1.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
]
gpu-utils = ["GPUtil>=1.4.0"]


[project.scripts]
textlens = "textlens.cli:main"

[project.urls]
Homepage = "https://github.com/Srevarshan05/textlens"
Documentation = "https://github.com/Srevarshan05/textlens/blob/main/docs/API_REFERENCE.md"
Source = "https://github.com/Srevarshan05/textlens"
Issues = "https://github.com/Srevarshan05/textlens/issues"

[tool.setuptools.packages.find]
include = ["textlens*"]
