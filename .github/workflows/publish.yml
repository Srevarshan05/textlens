name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI Trusted Publishing (OIDC),
# so no API token is stored in the repository. The trusted publisher on pypi.org
# must match: owner Srevarshan05, repository textlens, workflow publish.yml,
# environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('textlens/_version.py').read()).group(1))")
          test "v$version" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} != v$version"; exit 1; }
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/textlens --version
          /tmp/clean/bin/python -c "from textlens import OCR"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/textlens-ocr/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
